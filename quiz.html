  .top-nav a {

    border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; font-size: 0.8rem;

  .top-nav a.active { background: var(--red); border-color: var(--red); }
  main { max-width: 700px; margin: 1.5rem auto 3rem; padding: 0 1rem; }

  .lesson-tag {

  .question {

  .answers { display: flex; flex-direction: column; gap: 0.6rem; }
  .answer-btn {
    display: block; width: 100%; text-align: left; padding: 0.85rem 1.2rem;
    border: 2px solid #e5e7eb; background: var(--white); border-radius: 8px;
    cursor: pointer; font-size: 0.95rem; color: var(--text);

  .answer-btn:hover:not(:disabled) { border-color: var(--navy); background: #f0f4ff; }
  .answer-btn.correct { border-color: var(--green); background: var(--green-bg); color: #15803d; font-weight: 500; }
  .answer-btn.wrong { border-color: var(--red); background: var(--red-bg); color: #b91c1c; }
  .answer-btn:disabled { cursor: default; opacity: 0.65; }
  .answer-btn.correct:disabled, .answer-btn.wrong:disabled { opacity: 1; }
  .feedback {
    margin-top: 1.25rem; padding: 0.75rem 1rem; border-radius: 8px;
    font-size: 0.9rem; font-weight: 500; display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--green-bg); color: #15803d; border-left: 4px solid var(--green); }
  .feedback.wrong { background: var(--red-bg); color: #b91c1c; border-left: 4px solid var(--red); }
  .next-btn {
    display: none; margin-top: 1.5rem; padding: 0.65rem 2rem; border: none;
    background: var(--navy); color: var(--white); border-radius: 6px; cursor: pointer;
    font-size: 0.9rem; font-weight: 500; transition: background 0.15s ease; width: 100%;
  }
  .next-btn:hover { background: var(--red); }

  .score-bar {

    font-size: 0.85rem; color: var(--muted);

  .progress-track { flex: 1; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s ease; width: 0%; }
  .streak { font-size: 0.8rem; color: var(--muted); }
  .streak strong { color: var(--red); }
  .filter-bar { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filter-btn {
    padding: 0.3rem 0.7rem; border: 1.5px solid #d1d5db; background: var(--white);

    border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500;
    transition: background 0.15s ease;

const lessonNames = {
  1: "Values & Principles",
  2: "What Is the UK",
  3: "Early Britain",
  4: "Middle Ages",
  5: "Tudors & Stuarts",
  6: "Arts & Culture"
};

let pool = [];
let current = null;
let answered = 0;
let correct = 0;
let streak = 0;
let bestStreak = 0;
let activeFilters = new Set([1,2,3,4,5,6]);

const card = document.getElementById("card");
const lessonTag = document.getElementById("lessonTag");
const questionNum = document.getElementById("questionNum");
const questionText = document.getElementById("questionText");
const answersDiv = document.getElementById("answers");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const scoreText = document.getElementById("scoreText");
const progressFill = document.getElementById("progressFill");
const streakText = document.getElementById("streakText");
const filtersDiv = document.getElementById("filters");

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildFilters() {
  filtersDiv.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "filter-btn" + (activeFilters.size === 6 ? " active" : "");
  allBtn.textContent = "All";
  allBtn.addEventListener("click", () => { activeFilters = new Set([1,2,3,4,5,6]); resetQuiz(); });
  filtersDiv.appendChild(allBtn);
  for (let i = 1; i <= 6; i++) {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (activeFilters.has(i) && activeFilters.size < 6 ? " active" : "");
    btn.textContent = "L" + i;
    btn.title = lessonNames[i];
    btn.addEventListener("click", () => {
      if (activeFilters.size === 6) activeFilters = new Set([i]);
      else if (activeFilters.has(i) && activeFilters.size > 1) activeFilters.delete(i);
      else activeFilters.add(i);
      resetQuiz();
    });
    filtersDiv.appendChild(btn);
  }
}

function resetQuiz() {
  const filtered = questions.filter(q => activeFilters.has(q.lesson));
  pool = shuffle([...Array(filtered.length).keys()]);
  pool._source = filtered;
  answered = 0; correct = 0; streak = 0; bestStreak = 0;
  updateScore();
  buildFilters();
  // Restore card HTML if summary was shown
  card.innerHTML = '<span class="lesson-tag" id="lessonTag"></span>' +
    '<div class="question-num" id="questionNum"></div>' +
    '<div class="question" id="questionText"></div>' +
    '<div class="answers" id="answers"></div>' +
    '<div class="feedback" id="feedback"></div>' +
    '<button class="next-btn" id="nextBtn">Next Question</button>';
  document.getElementById("nextBtn").addEventListener("click", showNext);
  showNext();
}

function updateScore() {
  scoreText.textContent = correct + " / " + answered;
  const pct = answered > 0 ? (correct / answered * 100) : 0;
  progressFill.style.width = pct + "%";
  progressFill.style.background = pct >= 70 ? "var(--green)" : pct >= 40 ? "#f59e0b" : "var(--red)";
  streakText.innerHTML = streak >= 3 ? "<strong>" + streak + "</strong> streak" : "";
}

function showNext() {
  if (pool.length === 0) { showSummary(); return; }
  const idx = pool.pop();
  current = pool._source[idx];
  const total = pool._source.length;

  document.getElementById("lessonTag").textContent = "Lesson " + current.lesson + " \u2014 " + lessonNames[current.lesson];
  document.getElementById("questionNum").textContent = "Question " + (answered + 1) + " of " + total;
  document.getElementById("questionText").textContent = current.q;

  const ad = document.getElementById("answers");
  ad.innerHTML = "";
  shuffle([current.correct, ...current.wrong]).forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "answer-btn";
    btn.textContent = opt;
    btn.addEventListener("click", () => handleAnswer(opt, btn));
    ad.appendChild(btn);
  });

  const fb = document.getElementById("feedback");
  fb.className = "feedback"; fb.textContent = "";
  document.getElementById("nextBtn").classList.remove("show");
}

function handleAnswer(chosen, btn) {
  const ad = document.getElementById("answers");
  const fb = document.getElementById("feedback");
  const buttons = ad.querySelectorAll(".answer-btn");
  const isCorrect = chosen === current.correct;
  answered++;
  buttons.forEach(b => { b.disabled = true; if (b.textContent === current.correct) b.classList.add("correct"); });
  if (isCorrect) {
    correct++; streak++;
    if (streak > bestStreak) bestStreak = streak;
    fb.className = "feedback correct show";
    fb.textContent = "Correct!";
  } else {
    streak = 0;
    btn.classList.add("wrong");
    fb.className = "feedback wrong show";
    fb.textContent = "The correct answer is: " + current.correct;
  }
  updateScore();
  document.getElementById("nextBtn").classList.add("show");
}

function showSummary() {
  const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
  const cls = pct >= 70 ? "" : pct >= 40 ? " mid" : " low";
  card.innerHTML = '<div class="summary-card">' +
    "<h2>Quiz Complete!</h2>" +
    '<div class="big-score' + cls + '">' + pct + "%</div>" +
    "<p>You got <strong>" + correct + "</strong> out of <strong>" + answered + "</strong> correct." +
    (bestStreak >= 3 ? "<br>Best streak: <strong>" + bestStreak + "</strong>" : "") + "</p>" +
    '<button class="restart-btn" id="restartBtn">Try Again</button></div>';
  document.getElementById("restartBtn").addEventListener("click", resetQuiz);
}

document.addEventListener("keydown", (e) => {
  const nb = document.getElementById("nextBtn");
  if (e.key === "Enter" && nb && nb.classList.contains("show")) showNext();
  if (e.key >= "1" && e.key <= "4") {
    const btns = document.querySelectorAll("#answers .answer-btn:not(:disabled)");
    const idx = parseInt(e.key) - 1;
    if (btns[idx]) btns[idx].click();
  }
});

resetQuiz();
</script>
